<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolbox Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Toolbox Hub</h2>

    <div class="pages-list" id="pagesList">
        <a href="rp_calculator.html" class="page-card">
            <div class="page-info">
                <span class="page-title">RP Grind Calculator</span>
                <span class="page-desc">Big number calculator with custom rates and presets</span>
            </div>
            <span>➔</span>
        </a>
    </div>

    <div class="save-section" style="margin-top: 24px;">
        <label>Link Another Tool File</label>
        <div class="input-group">
            <input type="text" id="newPageTitle" placeholder="Page Title (e.g. Stat Calculator)" style="margin-bottom: 8px; width: 100%;">
            <div class="input-row">
                <input type="text" id="newPageFile" placeholder="Filename (e.g. stats.html)">
                <button class="btn" id="addPageBtn" style="width: 80px;">Add</button>
            </div>
        </div>
    </div>
</div>

<script src="hub.js"></script>
</body>
</html>
