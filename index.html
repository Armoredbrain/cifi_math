<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolbox Hub</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<div class="container">
    <h2>Toolbox Hub</h2>

    <!-- Global Settings Section -->
    <div class="save-section" style="margin-top: 0; margin-bottom: 20px; border-top: none; padding-top: 0;">
        <label>Global Tick Settings</label>
        <div class="input-group" style="margin-bottom: 0;">
            <div class="input-row">
                <input type="text" id="globalTickTime" value="1" placeholder="Tick Duration">
                <select id="globalTickUnit">
                    <option value="1">Seconds</option>
                    <option value="0.001">Milliseconds (ms)</option>
                    <option value="60">Minutes</option>
                </select>
            </div>
        </div>
    </div>

    <div class="pages-list" id="pagesList">
        <a href="rp_calculator.html" class="page-card">
            <div class="page-info">
                <span class="page-title">RP Grind Calculator</span>
                <span class="page-desc">Big number RP time calculator with custom rates and presets</span>
            </div>
            <span>➔</span>
        </a>

        <a href="shard_calculator.html" class="page-card">
            <div class="page-info">
                <span class="page-title">Shard Grind Calculator</span>
                <span class="page-desc">Calculates tick-based operation and cooldown grind times</span>
            </div>
            <span>➔</span>
        </a>
    </div>

    <div class="save-section" style="margin-top: 24px;">
        <label>Link Another Tool File</label>
        <div class="input-group">
            <input type="text" id="newPageTitle" placeholder="Page Title (e.g. Stat Calculator)" style="margin-bottom: 8px; width: 100%;">
            <div class="input-row">
                <input type="text" id="newPageFile" placeholder="Filename (e.g. stats.html)">
                <button class="btn" id="addPageBtn" style="width: 80px;">Add</button>
            </div>
        </div>
    </div>
</div>

<script src="hub.js?v=4"></script>
</body>
</html>
