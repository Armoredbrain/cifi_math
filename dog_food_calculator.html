<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Ration Chien</title>
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<div class="container">
    <div class="header-row">
        <a href="index.html" class="back-btn">← Hub</a>
        <h2>Ration Croquettes</h2>
    </div>

    <div class="input-group">
        <label for="adultWeight">Poids adulte estimé (kg)</label>
        <div class="input-row">
            <input type="number" id="adultWeight" value="37.5" min="1" max="90" step="0.5">
        </div>
    </div>

    <div class="input-group">
        <label for="age">Âge du chien (mois)</label>
        <div class="input-row">
            <input type="number" id="age" value="5" min="1.5" max="24" step="0.5">
        </div>
    </div>

    <div class="input-group">
        <label for="meals">Mode de repas</label>
        <div class="input-row">
            <select id="meals">
                <option value="1">1 repas / jour</option>
                <option value="2">2 repas / jour</option>
                <option value="3">3 repas / jour</option>
                <option value="4">4 repas / jour</option>
                <option value="transition" selected>Transition (3 → 2 repas)</option>
            </select>
        </div>
    </div>

    <!-- Transition Date Fields -->
    <div id="transitionGroup" class="input-group" style="background: var(--input-bg); padding: 14px; border-radius: 8px; border: 1px solid var(--border);">
        <label for="startDate">Date de début de transition</label>
        <div class="input-row" style="margin-bottom: 12px;">
            <input type="date" id="startDate" style="width: 100%;">
        </div>

        <label for="targetDate">Date sélectionnée</label>
        <div class="input-row" style="margin-bottom: 8px;">
            <input type="date" id="targetDate" style="width: 100%;">
        </div>

        <div id="transitionStatus" style="font-size: 0.85rem; font-weight: 600; color: var(--accent); text-align: center; margin-top: 6px;">
            Jour 0
        </div>
        <span class="hint" style="margin-top: 4px; text-align: center; display: block;">
            Midi: -10g/j | Matin: +5g/j | Soir: +5g/j
        </span>
    </div>

    <div class="results">
        <!-- Standard mode display -->
        <div class="result-main" id="standardResultBox">
            <div class="label">Dose par repas</div>
            <div class="value" id="perMeal">0 g</div>
        </div>

        <!-- Transition mode 3-meal grid -->
        <div id="transitionResultGrid" class="result-grid" style="grid-template-columns: 1fr 1fr 1fr; margin-bottom: 12px; display: none;">
            <div class="result-sub-item">
                <div class="sub-label">Matin</div>
                <div class="sub-val" id="morningVal" style="color: var(--accent);">0 g</div>
            </div>
            <div class="result-sub-item">
                <div class="sub-label">Midi</div>
                <div class="sub-val" id="lunchVal" style="color: var(--gold);">0 g</div>
            </div>
            <div class="result-sub-item">
                <div class="sub-label">Soir</div>
                <div class="sub-val" id="eveningVal" style="color: var(--accent);">0 g</div>
            </div>
        </div>

        <div class="result-grid">
            <div class="result-sub-item" style="grid-column: span 2;">
                <div class="sub-label">Ration journalière totale</div>
                <div class="sub-val" id="dailyTotal">0 g/jour</div>
            </div>
        </div>
    </div>

    <div class="save-section">
        <label>Profils & Sauvegardes</label>
        <div class="input-row">
            <input type="text" id="presetName" placeholder="Nom (ex: Max transition)">
            <button class="btn" id="saveBtn" style="width: 100px;">Save</button>
        </div>
        <div class="saved-list" id="savedList"></div>
    </div>

    <div class="hint">
        💧 Distribuez les croquettes sèches avec de l'eau fraîche à disposition.
    </div>
</div>

<script src="calculator.js?v=13"></script>
</body>
</html>
